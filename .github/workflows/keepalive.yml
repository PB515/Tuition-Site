name: keepalive
# Daily ping so the FREE Supabase project doesn't pause after 7 days idle.
# Setup: add repo secret SITE_URL = the deployed origin (e.g. https://inspire-academy.vercel.app).
# /api/health makes a real DB query, which resets the inactivity timer.
# Caveat: GitHub disables scheduled workflows after ~60 days with no repo commits —
# if the site is truly idle, use cron-job.org against <SITE_URL>/api/health instead.

on:
  schedule:
    - cron: '23 6 * * *' # daily ~06:23 UTC (off-the-hour: less likely to be delayed)
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          code=$(curl -fsS -o /dev/null -w '%{http_code}' "${{ secrets.SITE_URL }}/api/health" || true)
          echo "health -> $code"
          test "$code" = "200"
